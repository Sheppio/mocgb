<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mustang Owners Club of Great Britain app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MOCGB App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>MOCGB</title>
  <link rel="manifest" href="manifest.json">
  <!-- Splash screen, shown while Flutter starts: the club's three tail lights coming on in sequence on
       Guardsman Blue, with a line of loading messages. Hand-written: flutter_native_splash's web output
       is turned off in pubspec.yaml so it doesn't overwrite this. -->
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #1b2a4e; }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #1b2a4e;
      transition: opacity 0.2s ease-out;
    }
    #splash.done { opacity: 0; }
    .splash-lights { display: flex; gap: 7px; }
    .splash-lights span {
      width: 22px;
      height: 74px;
      border-radius: 2px;
      background: #d01c25;
      box-shadow: inset 0 5px 0 #ea3e45;   /* the lighter strip along the top, as in the app icon */
    }
    @media (prefers-reduced-motion: no-preference) {
      /* Like a Mustang's sequential tail lights: on left to right, then off left to right */
      .splash-lights span { animation: splash-light 2.4s ease-in-out infinite both; }
      .splash-lights span:nth-child(2) { animation-delay: 0.2s; }
      .splash-lights span:nth-child(3) { animation-delay: 0.4s; }
    }
    @keyframes splash-light {
      0%, 100% { background: #4a1518; box-shadow: inset 0 5px 0 #5a1c20; }
      12% { background: #ff2a2f; box-shadow: inset 0 5px 0 #ff6a6e, 0 0 18px #ff2a2f; }
      25%, 70% { background: #d01c25; box-shadow: inset 0 5px 0 #ea3e45; }
      88% { background: #4a1518; box-shadow: inset 0 5px 0 #5a1c20; }
    }
    .splash-status {
      margin: 0;
      min-height: 1.4em;
      color: #c5cbd8;
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 0 24px;
    }
  </style>
  <script>
    // The splash's status line: a message every 0.75s so the wait feels like steady progress, holding on
    // the last one until the app is ready. After 10s it says a slow connection can take a little longer.
    window.mocgbSplash = {
      messages: ["Loading the app\u2026", "Loading events\u2026", "Loading meetings\u2026",
                 "Starting the app\u2026", "Opening the home page\u2026"],
      step: 0,
      show(text) {
        const line = document.getElementById("splash-status");
        if (line) line.textContent = text ?? this.messages[this.step];
      },
    };
    const splashTimer = setInterval(() => {
      if (mocgbSplash.step < mocgbSplash.messages.length - 1) mocgbSplash.step++;
      mocgbSplash.show();
    }, 750);
    setTimeout(() => {
      clearInterval(splashTimer);
      mocgbSplash.show("Still loading. A slow connection can take a little longer.");
    }, 10000);
    // Called by flutter_native_splash once the app has drawn its first screen
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (!splash) return;
      splash.classList.add("done");
      setTimeout(() => splash.remove(), 200);
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <meta name="theme-color" content="#fafaf8">
  <!-- Start fetching the font and the club data straight away, alongside Flutter's engine, instead of
       waiting for the app's code to ask for them. The first screen needs all three. -->
  <link rel="preload" href="assets/assets/fonts/Archivo.ttf" as="fetch" crossorigin>
  <link rel="preload" href="/data/events.json" as="fetch" crossorigin>
  <link rel="preload" href="/data/areas.json" as="fetch" crossorigin>
  <script>
    // Install support: Chrome, Edge and Android offer to install before Flutter has started, so keep
    // the offer here for the app's Install button (lib/install_web.dart) to use later.
    addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      window.mocgbInstallPrompt = event;
      dispatchEvent(new Event("mocgb-install-change"));
    });
    addEventListener("appinstalled", () => {
      window.mocgbInstallPrompt = null;
      window.mocgbInstalled = true;
      dispatchEvent(new Event("mocgb-install-change"));
    });
  </script>
</head>
<body>
  <div id="splash">
    <div class="splash-lights" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="splash-status" id="splash-status" role="status">Loading the app…</p>
  </div>
  <script>mocgbSplash.show();</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
